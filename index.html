<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IELTS 工作台 · 雅思备考</title>
<meta name="description" content="雅思备考工作台：10 周计划、模考记录、词汇、写作与口语题库，进度可导出导入。">
<link rel="preconnect" href="https://miaoda.feishu.cn" crossorigin>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root{
  --paper:#F5F1E8;
  --sheet:#FFFDF7;
  --ink:#191813;
  --ink-70:#4B463C;
  --ink-45:#6B6558;
  --line:#D8CFBC;
  --line-soft:#E7DFCE;
  --red:#B03A2B;
  --red-soft:#F2E3DE;
  --teal:#2C5A5C;
  --teal-soft:#E3EBE6;
  --ochre:#9A6F22;
  --font-display:"Noto Serif SC","Songti SC","Noto Serif","Georgia",serif;
  --font-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --rail:250px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--font-body);font-weight:400;font-size:15px;line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--red);color:var(--sheet)}
a{color:var(--ink);text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:1px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--paper)}
::-webkit-scrollbar-thumb{background:#C9C0AC;border:3px solid var(--paper);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--ink-45)}

/* ---------- 框架 ---------- */
.rail{
  position:fixed;inset:0 auto 0 0;width:var(--rail);
  padding:30px 26px 22px;border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:26px;background:var(--paper);z-index:2;
}
.brand{display:flex;align-items:baseline;gap:10px}
.brand-mark{
  width:30px;height:30px;border:1px solid var(--ink);display:grid;place-items:center;
  font-family:var(--font-display);font-weight:700;font-size:17px;line-height:1;
  transform:translateY(4px);
}
.brand-t{font-family:var(--font-display);font-weight:600;font-size:19px;letter-spacing:.06em}
.brand-x{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-45);display:block;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:1px;margin-top:6px}
.nav a{
  display:flex;align-items:center;gap:10px;padding:9px 0;font-size:14.5px;color:var(--ink-70);
  border-bottom:1px solid transparent;transition:color .18s ease,transform .18s ease;
}
.nav a::before{content:"";width:5px;height:5px;background:transparent;transition:background .18s}
.nav a:hover{color:var(--ink);transform:translateX(2px)}
.nav a.on{color:var(--ink);font-weight:500}
.nav a.on::before{background:var(--red)}
.nav a .nv{margin-left:auto;font-size:11.5px;color:var(--ink-45);font-variant-numeric:tabular-nums}
.rail-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:16px;font-size:12.5px;color:var(--ink-45);line-height:1.9}
.rail-foot b{font-family:var(--font-display);font-size:26px;color:var(--ink);font-variant-numeric:tabular-nums;margin:0 3px}
.rail-foot .rf-row{display:flex;justify-content:space-between}

.main{margin-left:var(--rail);padding:44px 52px 90px;max-width:1180px}
.view{animation:rise .5s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- 标题与文本 ---------- */
h1{
  font-family:var(--font-display);font-weight:600;font-size:clamp(26px,3.4vw,40px);
  line-height:1.25;letter-spacing:-.01em;margin:0 0 10px;text-wrap:balance;
}
h2{font-family:var(--font-display);font-weight:600;font-size:21px;margin:0 0 4px;letter-spacing:0}
h3{font-weight:500;font-size:15px;margin:0 0 8px}
.lede{color:var(--ink-70);max-width:68ch;margin:0 0 30px;text-wrap:pretty}
.muted{color:var(--ink-45)}
.small{font-size:12.5px;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}
h1 .thin{font-weight:400;color:var(--ink-45)}

/* ---------- 分区 ---------- */
.block{border-top:1px solid var(--line);padding:26px 0 30px}
.block>.hd{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:14px}
.block>.hd h2{margin:0}
.block>.hd .sub{font-size:12.5px;color:var(--ink-45)}
.grid-2{display:grid;grid-template-columns:minmax(0,1fr) 306px;gap:52px;align-items:start}
@media (max-width:1080px){.grid-2{grid-template-columns:minmax(0,1fr);gap:34px}}

/* ---------- 数据行 ---------- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 0 34px}
.stat{padding:18px 14px 16px;border-left:1px solid var(--line-soft)}
.stat:first-child{border-left:0;padding-left:0}
.stat .k{font-size:11.5px;letter-spacing:.16em;color:var(--ink-45);text-transform:uppercase}
.stat .v{font-family:var(--font-display);font-size:30px;line-height:1.2;font-variant-numeric:tabular-nums;margin-top:4px}
.stat .v em{font-style:normal;font-size:13px;color:var(--ink-45);margin-left:3px;font-family:var(--font-body)}
@media (max-width:640px){.stats{grid-template-columns:1fr 1fr}.stat:nth-child(3){border-left:0;padding-left:0}.stat{border-top:1px solid var(--line-soft)}.stat:nth-child(-n+2){border-top:0}}

/* ---------- 任务行 ---------- */
.tasks{display:flex;flex-direction:column}
.taskrow{
  display:grid;grid-template-columns:18px minmax(0,1fr) 52px;column-gap:14px;align-items:start;
  padding:13px 0;border-bottom:1px solid var(--line-soft);cursor:pointer;
  transition:background .15s ease;
}
.taskrow:hover{background:rgba(176,58,43,.035)}
.taskrow input{
  appearance:none;-webkit-appearance:none;width:16px;height:16px;margin:4px 0 0;border:1px solid var(--ink-45);
  background:transparent;cursor:pointer;position:relative;flex:none;border-radius:1px;transition:border-color .15s,background .15s;
}
.taskrow input:checked{border-color:var(--ink);background:var(--ink)}
.taskrow input:checked::after{
  content:"";position:absolute;left:4px;top:1px;width:5px;height:9px;
  border-right:2px solid var(--sheet);border-bottom:2px solid var(--sheet);transform:rotate(38deg);
}
.taskrow .t{font-size:15px;line-height:1.55}
.taskrow .s{display:block;color:var(--ink-45);font-size:12.5px;line-height:1.6;margin-top:2px;padding-right:8px}
.taskrow .m{font-size:12px;color:var(--ink-45);text-align:right;font-variant-numeric:tabular-nums;padding-top:2px}
.taskrow.done .t{color:var(--ink-45);text-decoration:line-through;text-decoration-color:var(--line);text-decoration-thickness:1px}
.taskrow.done .m{color:var(--line)}

/* ---------- 周折叠 ---------- */
.week{border-top:1px solid var(--line)}
.week-hd{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;
  background:none;border:0;padding:16px 0;text-align:left;cursor:pointer}
.week-hd .wn{font-family:var(--font-display);font-size:15px;color:var(--ink-45);font-variant-numeric:tabular-nums}
.week-hd .wt{font-size:15px;font-weight:500}
.week-hd .wp{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-45)}
.week-hd .bar{width:82px;height:2px;background:var(--line);position:relative;overflow:hidden}
.week-hd .bar i{position:absolute;inset:0 auto 0 0;background:var(--teal);transition:width .3s ease}
.week-hd .care{width:9px;height:9px;border-right:1.5px solid var(--ink-45);border-bottom:1.5px solid var(--ink-45);transform:rotate(45deg);transition:transform .2s;margin-left:2px}
.week.open .week-hd .care{transform:rotate(-135deg)}
.week-body{display:none;padding:0 0 20px 78px}
.week.open .week-body{display:block}
.week.cur .wn{color:var(--red);font-weight:600}
@media (max-width:640px){.week-hd{grid-template-columns:40px 1fr auto}.week-body{padding-left:0}}

/* ---------- 目标对比 ---------- */
.cmp{margin:0 0 18px}
.cmp .l{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.cmp .l b{font-variant-numeric:tabular-nums;font-weight:500}
.cmp .l b i{font-style:normal;color:var(--ink-45);font-weight:400}
.cmp .track{height:6px;background:var(--line-soft);position:relative}
.cmp .fill{position:absolute;inset:0 auto 0 0;background:var(--teal);transition:width .4s ease}
.cmp .goal{position:absolute;top:-3px;width:1px;height:12px;background:var(--red)}

/* ---------- 图表 ---------- */
.chartwrap{margin:6px 0 0}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--font-body);fill:var(--ink-45);font-size:11px}
.chart .val{fill:var(--ink);font-size:11.5px;font-variant-numeric:tabular-nums}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart .gl{stroke:var(--line-soft);stroke-width:1}
.chart .line{stroke:var(--teal);stroke-width:2;fill:none}
.chart .dot{fill:var(--red);r:3.4}
.legend{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-45);margin:8px 0 0}
.legend i{width:16px;height:0;border-top:1px dashed var(--red);display:inline-block}
.empty{padding:26px 0;color:var(--ink-45);font-size:14px;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);margin:6px 0 0}

/* ---------- 表格 ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:400;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-45);padding:0 10px 8px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 10px 11px 0;border-bottom:1px solid var(--line-soft);vertical-align:top}
.tbl td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.sc{font-family:var(--font-display);font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr:hover td{background:rgba(176,58,43,.03)}
.tbl .note{color:var(--ink-45);font-size:12.5px;line-height:1.55}
.xbtn{background:none;border:0;color:var(--ink-45);cursor:pointer;font-size:12px;padding:2px 0;border-bottom:1px solid transparent}
.xbtn:hover{color:var(--red);border-bottom-color:var(--red)}
@media (max-width:640px){.tbl{font-size:12.5px}.tbl .hide-sm{display:none}}

/* ---------- 表单 ---------- */
.form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-45)}
.field input,.field select,.field textarea{
  width:100%;background:var(--sheet);border:1px solid var(--line);border-radius:2px;
  padding:9px 11px;line-height:1.4;font-size:14px;transition:border-color .15s;
}
.field input:hover,.field select:hover,.field textarea:hover{border-color:#C6BBA4}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink);outline:2px solid var(--red);outline-offset:1px}
.field textarea{resize:vertical;min-height:64px}
.field.wide{grid-column:1/-1}
.field-row{grid-column:1/-1;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.field-row .field{flex:1 1 240px}
.field-row .btn{flex:0 0 auto}
.hint{font-size:12px;color:var(--ink-45);margin-top:2px}
.btn{
  display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);background:transparent;
  border-radius:2px;padding:9px 16px;font-size:13.5px;font-weight:500;cursor:pointer;
  transition:background .18s ease,color .18s ease,transform .18s ease;
}
.btn:hover{background:var(--ink);color:var(--sheet)}
.btn:active{transform:translateY(1px)}
.btn.solid{background:var(--ink);color:var(--sheet)}
.btn.solid:hover{background:var(--red);border-color:var(--red)}
.btn.ghost{border-color:var(--line);color:var(--ink-70)}
.btn.ghost:hover{border-color:var(--ink);color:var(--ink);background:transparent}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.danger:hover{background:var(--red);color:var(--sheet)}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}

/* ---------- 词条 ---------- */
.lexrow{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:16px;align-items:start;
  padding:14px 0;border-bottom:1px solid var(--line-soft)}
.lexrow .term{font-family:var(--font-display);font-size:17px;letter-spacing:.01em}
.lexrow .def{font-size:13.5px;color:var(--ink-70)}
.lexrow .ex{display:block;color:var(--ink-45);font-size:12.5px;margin-top:3px;line-height:1.6}
.lexrow .lv{display:flex;gap:4px;align-items:center;padding-top:4px}
.dots{display:flex;gap:3px}
.dot5{width:6px;height:6px;background:var(--line);border-radius:50%}
.dot5.on{background:var(--teal)}
.lexrow.got .term{color:var(--ink-45)}
@media (max-width:700px){.lexrow{grid-template-columns:1fr}.lexrow .lv{justify-content:flex-start}}

/* ---------- 筛选 ---------- */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:2px;overflow:hidden;background:var(--sheet)}
.seg button{background:none;border:0;padding:7px 14px;font-size:12.5px;color:var(--ink-70);cursor:pointer;border-left:1px solid var(--line);transition:background .15s,color .15s}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--ink);color:var(--sheet)}
.seg button:not(.on):hover{background:var(--red-soft);color:var(--ink)}

/* ---------- 计时 ---------- */
.timer{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:20px 0;margin:0 0 8px;display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.clock{font-family:var(--font-display);font-size:44px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.01em;min-width:150px}
.clock.run{color:var(--red)}
.timer .meta{font-size:12.5px;color:var(--ink-45);line-height:1.8}
.timer .grow{flex:1 1 180px}

/* ---------- 题目 ---------- */
.promptlist{display:flex;flex-direction:column}
.prompt{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:12px;align-items:start;
  padding:14px 0;border-bottom:1px solid var(--line-soft)}
.prompt .no{font-size:11.5px;color:var(--ink-45);font-variant-numeric:tabular-nums;padding-top:3px}
.prompt .q{font-size:14px;line-height:1.65}
.prompt .meta{font-size:12px;color:var(--ink-45);margin-top:3px}
.prompt .go{align-self:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chip{font-size:11.5px;padding:3px 8px;border:1px solid var(--line);border-radius:2px;color:var(--ink-70);background:var(--sheet);cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}

/* ---------- 数据页 ---------- */
.panel{border:1px solid var(--line);background:var(--sheet);padding:22px 24px;border-radius:2px;margin-bottom:26px}
.panel h3{font-family:var(--font-display);font-size:17px;font-weight:600;margin:0 0 6px}
.panel .p-lede{font-size:13px;color:var(--ink-45);margin:0 0 16px;max-width:64ch}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px 22px;margin:0 0 4px}
.kv div .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-45)}
.kv div .v{font-family:var(--font-display);font-size:22px;font-variant-numeric:tabular-nums}
.drop{display:block;border:1px dashed var(--line);border-radius:2px;padding:26px 22px;text-align:center;color:var(--ink-45);font-size:13px;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover{border-color:var(--ink);background:rgba(176,58,43,.03)}
.drop strong{display:block;color:var(--ink);font-size:14px;font-weight:500;margin-bottom:3px}
.prev{border-top:1px solid var(--line);margin-top:16px;padding-top:14px;font-size:13px;display:none}
.prev.show{display:block}
.prev .row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dotted var(--line-soft)}
.prev .row b{font-weight:500;font-variant-numeric:tabular-nums}

/* ---------- 提示 ---------- */
.toast{
  position:fixed;left:calc(var(--rail) + 40px);bottom:26px;background:var(--ink);color:var(--sheet);
  padding:11px 18px;border-radius:2px;font-size:13px;letter-spacing:.02em;opacity:0;transform:translateY(8px);
  transition:opacity .25s ease,transform .25s ease;pointer-events:none;z-index:10;max-width:78vw;
}
.toast.on{opacity:1;transform:none}
@media (max-width:900px){.toast{left:18px;right:18px;bottom:14px}}

/* ---------- 备注 ---------- */
.footnote{font-size:12px;color:var(--ink-45);border-top:1px solid var(--line-soft);padding-top:14px;margin-top:28px;line-height:1.8}

/* ---------- 移动端 ---------- */
@media (max-width:900px){
  :root{--rail:0px}
  .rail{position:static;width:100%;padding:18px 20px 12px;border-right:0;border-bottom:1px solid var(--line);gap:14px}
  .nav{flex-direction:row;overflow-x:auto;gap:18px;margin-top:2px;padding-bottom:4px;padding-right:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .nav::-webkit-scrollbar{display:none}
  .nav a{white-space:nowrap;padding:6px 0;border-bottom:1px solid transparent}
  .nav a.on{border-bottom-color:var(--red)}
  .nav a .nv{display:none}
  .rail-foot{display:none}
  .main{margin-left:0;padding:26px 20px 80px}
  h1{font-size:28px}
}
@media print{.rail{display:none}.main{margin:0;padding:0}}
</style>
</head>
<body>
<aside class="rail">
  <div class="brand">
    <span class="brand-mark">雅</span>
    <div>
      <div class="brand-t">IELTS 工作台</div>
      <span class="brand-x">Academic · 学术类</span>
    </div>
  </div>
  <nav class="nav" id="nav" aria-label="主导航"></nav>
  <div class="rail-foot" id="railFoot"></div>
</aside>
<main class="main"><div id="view" class="view"></div></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
  'use strict';

  var KEY = 'ielts.bench.v3';
  var mem = null, storageOK = true;
  var $ = function(s){ return document.getElementById(s); };
  var esc = function(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  };
  var uid = function(){ return Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4); };
  var pad = function(n){ return (n<10?'0':'') + n; };
  var iso = function(d){ d = d || new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
  var today = function(){ return iso(new Date()); };
  var parseD = function(s){ var p = String(s||'').split('-'); return new Date(+p[0], (+p[1]||1)-1, +p[2]||1); };
  var addDays = function(s, n){ var d = parseD(s); d.setDate(d.getDate()+n); return iso(d); };
  var diffDays = function(a, b){ return Math.round((parseD(b) - parseD(a)) / 86400000); };
  var WD = ['日','一','二','三','四','五','六'];
  var cnDate = function(s){ var d = parseD(s); return d.getFullYear()+' 年 '+(d.getMonth()+1)+' 月 '+d.getDate()+' 日'; };
  var shortD = function(s){ var p = String(s).split('-'); return p[1]+'.'+p[2]; };
  var mmss = function(sec){
    sec = Math.max(0, Math.floor(sec));
    return pad(Math.floor(sec/60)) + ':' + pad(sec%60);
  };

  /* ============ 技能 ============ */
  var SK = [
    {k:'L', zh:'听力', en:'Listening'},
    {k:'R', zh:'阅读', en:'Reading'},
    {k:'W', zh:'写作', en:'Writing'},
    {k:'S', zh:'口语', en:'Speaking'}
  ];
  var skName = function(k){ for(var i=0;i<SK.length;i++){ if(SK[i].k===k) return SK[i].zh; } return '全套'; };

  /* ============ 10 周计划 ============ */
  var PLAN = [

    var step = (max - min) <= 2 ? 0.5 : 1;
    var xf = function(i){ return items.length === 1 ? pl + (W - pl - pr) / 2 : pl + i * (W - pl - pr) / (items.length - 1); };
    var yf = function(v){ return pt + (max - v) / (max - min) * (H - pt - pb); };
    var out = ['<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(opt.label || '成绩趋势') + '">'];
    for(var g = min; g <= max + 0.001; g += step){
      var y = yf(g);
      out.push('<line class="' + (g === min ? 'axis' : 'gl') + '" x1="' + pl + '" y1="' + y + '" x2="' + (W - pr) + '" y2="' + y + '"/>');
      out.push('<text x="' + (pl - 16) + '" y="' + (y + 4) + '" text-anchor="end">' + g.toFixed(1) + '</text>');
    }
    if(opt.goal != null){
      var gy = yf(opt.goal);
      out.push('<line x1="' + pl + '" y1="' + gy + '" x2="' + (W - pr) + '" y2="' + gy + '" stroke="#B03A2B" stroke-width="1" stroke-dasharray="4 5" opacity=".85"/>');
    }
    out.push('<polyline class="line" points="' + items.map(function(it, i){ return xf(i) + ',' + yf(it.v); }).join(' ') + '"/>');
    items.forEach(function(it, i){
      var cx = xf(i), cy = yf(it.v);
      out.push('<circle class="dot" cx="' + cx + '" cy="' + cy + '"><title>' + esc(it.label + ' · ' + it.v.toFixed(1)) + '</title></circle>');
      var anchor = i === 0 ? 'start' : (i === items.length - 1 ? 'end' : 'middle');
      var lx = i === 0 ? cx + 9 : (i === items.length - 1 ? cx - 2 : cx);
      out.push('<text class="val" x="' + lx + '" y="' + (cy - 11) + '" text-anchor="' + anchor + '">' + it.v.toFixed(1) + '</text>');
      out.push('<text x="' + cx + '" y="' + (H - 10) + '" text-anchor="middle">' + esc(shortD(it.label)) + '</text>');
    });
    out.push('</svg>');
    return out.join('');
  }

          + '<div class="field"><label for="wrWords">字数</label><input id="wrWords" name="words" type="number" min="50" max="500" placeholder="270"></div>'

        + (logs ? '<table class="tbl"><thead><tr><th>日期</th><th>题型</th><th class="hide-sm">题目</th><th>用时</th><th>字数</th><th>分数</th><th></th></tr></thead><tbody>' + logs + '</tbody></table>' : '<div class="empty">还没有批改记录。写第一篇时就记下用时和字数，一个月后能看出变化。</div>')

  }
  function avgBand(type){
    var list = S.writing.filter(function(l){ return l.type === type && l.band != null; });
    if(!list.length) return null;
    return list.reduce(function(a,l){ return a + (+l.band); }, 0) / list.length;
  }

  /* ============ 视图：口语 ============ */

    return '<h1>口语</h1>'

      + '<div class="timer"><div><div class="clock" id="cdClock">00:00</div><div class="meta" id="cdMeta">准备 1 分钟，作答 2 分钟</div></div>'
        + '<div class="btnrow" style="margin:0"><button class="btn sm" data-act="cd2">Part 2：1′+2′</button><button class="btn sm ghost" data-act="cd-stop">停止</button></div></div>'
      + '<section class="block"><div class="hd"><h2>题库</h2><span class="seg">'
        + [['1','Part 1'],['2','Part 2'],['3','Part 3']].map(function(x){
            return '<button class="' + (part === x[0] ? 'on' : '') + '" data-act="spart" data-arg="' + x[0] + '">' + x[1] + '</button>';
          }).join('') + '</span></div><div class="promptlist">' + body + '</div></section>'
      + '<section class="block"><div class="hd"><h2>练习记录</h2><span class="sub">' + list.length + ' 次</span></div>'
        + '<form class="form" data-form="speaking" style="margin-bottom:18px">'
          + '<div class="field"><label for="spDate">日期</label><input id="spDate" name="date" type="date" value="' + today() + '" required></div>'
          + '<div class="field"><label for="spPart">部分</label><select id="spPart" name="part"><option>1</option><option>2</option><option>3</option></select></div>'
          + '<div class="field"><label for="spMin">时长（分钟）</label><input id="spMin" name="minutes" type="number" min="1" max="90" placeholder="15"></div>'
          + '<div class="field wide"><label for="spPrompt">题目</label><input id="spPrompt" name="prompt" placeholder="Describe a skill you learned…"></div>'
          + '<div class="field wide"><label for="spNote">卡在哪</label><input id="spNote" name="notes" placeholder="Part 3 只会列观点，没有展开原因"></div>'
          + '<div class="field" style="align-self:end"><button class="btn solid" type="submit">记录</button></div>'
        + '</form>'
        + (logs ? '<table class="tbl"><thead><tr><th>日期</th><th>部分</th><th class="hide-sm">题目</th><th>时长</th><th class="hide-sm">复盘</th><th></th></tr></thead><tbody>' + logs + '</tbody></table>' : '<div class="empty">还没有口语记录。今晚挑三张 Part 2，录音后各记一条。</div>')
      + '</section>';
  }

  /* ============ 视图：数据 ============ */

    var p = S.profile, t = p.target;
    var done = ALL_TASKS.filter(function(x){ return S.tasks[x.id] && S.tasks[x.id].done; }).length;
    var size = 0;
    try{ size = localStorage.getItem(KEY).length; }catch(e){ size = JSON.stringify(S).length; }

      + '<p class="lede">进度存在浏览器本地。换电脑、清缓存、换浏览器都会丢，所以每次学完顺手导出一份；到新设备再导入，勾选和记录都会回来。</p>'
      + '<div class="panel"><h3>导出一份进度</h3><p class="p-lede">得到一个 JSON 文件，含计划勾选、成绩、词汇、写作口语记录与专注时长。文件名带日期。</p>'
        + '<div class="kv" style="margin-bottom:16px">'
          + '<div><div class="k">计划完成</div><div class="v">' + done + '/50</div></div>'
          + '<div><div class="k">成绩记录</div><div class="v">' + S.logs.length + '</div></div>'

          + '<div><div class="k">写作 / 口语</div><div class="v">' + S.writing.length + ' / ' + S.speaking.length + '</div></div>'
          + '<div><div class="k">数据量</div><div class="v">' + (size > 1024 ? (Math.round(size/1024*10)/10) + ' KB' : size + ' B') + '</div></div>'
        + '</div>'
        + '<div class="btnrow" style="margin:0"><button class="btn solid" data-act="export">下载进度文件</button><button class="btn ghost" data-act="copy">复制 JSON</button></div>'
        + '<p class="hint" style="margin-top:10px">上次导出：' + (S.meta.lastExport ? esc(cnDate(S.meta.lastExport.slice(0,10))) : '还没有导出过') + '</p>'
      + '</div>'
      + '<div class="panel"><h3>导入进度</h3><p class="p-lede">选择之前导出的 JSON。先看预览，再决定合并还是覆盖。</p>'

      + '</div>'
      + '<div class="panel"><h3>目标与考试信息</h3><p class="p-lede">改完保存即刻生效，倒计时与小分目标会跟着变。</p>'

          + '<div class="field"><label for="pfDate">考试日期</label><input id="pfDate" name="examDate" type="date" value="' + esc(p.examDate) + '" required></div>'
          + '<div class="field"><label for="pfOverall">目标总分</label><input id="pfOverall" name="overall" type="number" step="0.5" min="4" max="9" value="' + t.overall + '"></div>'
          + '<div class="field"><label for="pfHours">每周可用小时</label><input id="pfHours" name="weeklyHours" type="number" min="1" max="60" value="' + p.weeklyHours + '"></div>'
          + ['L','R','W','S'].map(function(k){
              return '<div class="field"><label for="pf' + k + '">' + skName(k) + '目标</label><input id="pf' + k + '" name="' + k + '" type="number" step="0.5" min="4" max="9" value="' + t[k] + '"></div>';
            }).join('')
          + '<div class="field wide" style="margin-top:4px"><label>计划起点</label><div class="btnrow" style="margin:0"><span class="hint">当前从 ' + esc(S.profile.startedAt) + ' 起算</span><button class="btn sm ghost" type="button" data-act="reset-plan">从今天重新起算 10 周</button></div></div>'
          + '<div class="field" style="align-self:end"><button class="btn solid" type="submit">保存设置</button></div>'
        + '</form></div>'
      + '<div class="panel"><h3>清空</h3><p class="p-lede">清掉这台设备上的全部记录，回到初始状态。清空前请先导出。</p>'
        + '<div class="btnrow" style="margin:0"><button class="btn danger" data-act="wipe">清空所有数据</button></div>'

  /* ============ 渲染 ============ */
  function render(){
    var routes = {overview:viewOverview, plan:viewPlan, scores:viewScores, lexis:viewLexis, writing:viewWriting, speaking:viewSpeaking, data:viewData};
    var fn = routes[ui.route] || viewOverview;
    $('view').innerHTML = fn();

    var nav = NAV.map(function(n){
      var b = navBadge(n.r);
      return '<a href="#/' + n.r + '" class="' + (ui.route === n.r ? 'on' : '') + '">' + n.t + (b ? '<span class="nv">' + esc(b) + '</span>' : '') + '</a>';
    }).join('');
    $('nav').innerHTML = nav;

    var left = diffDays(today(), S.profile.examDate);
    $('railFoot').innerHTML = (S.profile.name ? '<div class="rf-row"><span>备考人</span><span>' + esc(S.profile.name) + '</span></div>' : '')
      + '<div>距考试</div><b>' + Math.max(0, left) + '</b><span>天</span>'
      + '<div class="rf-row"><span>目标</span><span class="num">' + S.profile.target.overall.toFixed(1) + '</span></div>'
      + '<div class="rf-row"><span>本周</span><span class="num">W' + curWeek() + '</span></div>';

    syncLogKind();
    syncFocus();
    syncCD();
  }
  function syncLogKind(){
    var sel = $('lgSkill'); if(!sel) return;
    var one = $('oneScoreWrap'), band = $('bandWrap');
    if(!one || !band) return;
    var isAll = sel.value === 'ALL';
    one.style.display = isAll ? 'none' : '';
    band.style.display = isAll ? '' : 'none';
  }

  /* ============ 计时器 ============ */
  var FOCUS = {start:null};
  var CD = {end:null, total:0, label:''};
  function syncFocus(){
    var el = $('focusClock'); if(!el) return;
    if(!FOCUS.start){ el.textContent = '00:00'; el.classList.remove('run'); return; }
    var sec = (Date.now() - FOCUS.start) / 1000;
    el.textContent = mmss(sec); el.classList.add('run');
    var m = $('focusMeta'); if(m) m.textContent = '专注中，结束时按分钟记账。';
  }
  function syncCD(){
    var el = $('cdClock'); if(!el) return;
    if(!CD.end){ el.textContent = '00:00'; el.classList.remove('run'); return; }
    var left = (CD.end - Date.now()) / 1000;
    el.textContent = mmss(left); el.classList.toggle('run', left > 0);
    var m = $('cdMeta');
    if(left <= 0){ el.textContent = '时间到'; if(m) m.textContent = CD.label || '时间到，停下来复盘。'; }
    else if(m) m.textContent = CD.label || '计时中';
  }
  setInterval(function(){ syncFocus(); syncCD(); }, 500);

  function startFocus(){
    if(FOCUS.start) return toast('已经在计时了');
    FOCUS.start = Date.now(); syncFocus(); toast('开始计时');
  }
  function endFocus(){
    if(!FOCUS.start) return toast('还没有在计时');
    var mins = Math.max(1, Math.round((Date.now() - FOCUS.start) / 60000));
    S.sessions.push({id:uid(), date: today(), minutes: mins, kind:'focus'});
    FOCUS.start = null; save(); toast('记下 ' + mins + ' 分钟专注'); render();
  }
  function startCD(sec, label){
    CD.total = sec; CD.end = Date.now() + sec * 1000; CD.label = label || '';
    syncCD(); toast('计时 ' + Math.round(sec/60) + ' 分钟');
  }
  function stopCD(){ CD.end = null; CD.total = 0; syncCD(); }

  /* ============ 交互 ============ */
  document.addEventListener('change', function(e){
    var el = e.target;
    if(el && el.id === 'lgSkill'){ syncLogKind(); }
    if(el && el.id === 'importFile'){ handleFile(el.files && el.files[0]); }
  });

  document.addEventListener('click', function(e){
    var btn = e.target.closest('[data-act]');
    if(!btn) return;
    var act = btn.getAttribute('data-act'), arg = btn.getAttribute('data-arg');
    if(btn.tagName === 'INPUT') return; // 勾选交给 change
    switch(act){
      case 'week':
        ui.openWeek = (ui.openWeek === +arg) ? -1 : +arg; render(); break;
      case 'week-open-cur': ui.openWeek = curWeek(); render(); break;
      case 'metric': ui.metric = arg; render(); break;
      case 'lex': ui.lex = arg; render(); break;
      case 'wpart': ui.wPart = arg; render(); break;
      case 'spart': ui.sPart = arg; render(); break;
      case 'focus-start': startFocus(); break;
      case 'focus-end': endFocus(); break;
      case 'cd': startCD(+arg, +arg === 1200 ? 'Task 1 · 20 分钟' : 'Task 2 · 40 分钟'); break;
      case 'cd2': startCD(60, '准备 1 分钟'); setTimeout(function(){ startCD(120, '作答 2 分钟'); }, 61000); break;
      case 'start-s': startCD(+arg, '说满 ' + arg + ' 秒'); break;
      case 'start-w': startCD(+arg * 60, '写这篇'); break;
      case 'cd-stop': stopCD(); break;
      case 'del-log': delLog(arg); break;
      case 'del-writing': delWriting(arg); break;
      case 'del-speaking': delSpeaking(arg); break;
      case 'word-ok': wordReview(arg, true); break;
      case 'word-no': wordReview(arg, false); break;
      case 'export': doExport(); break;
      case 'copy': doCopy(); break;
      case 'reset-plan':
        if(confirm('把 10 周计划的起点改成今天？已完成的任务勾选会保留。')){ S.profile.startedAt = today(); save(); render(); toast('计划已从今天重新起算'); }
        break;
      case 'wipe':
        if(confirm('确定清空全部记录？这一步不能撤销。')){
          if(confirm('再确认一次：清空后只能靠之前导出的文件恢复。')){
            S = fresh();
            S.words = WORDS.map(function(w){ return {id:uid(), term:w[0], meaning:w[1], ex:w[2], lv:0, addedAt: today(), dueAt: today()}; });
            save(); render(); toast('已清空');
          }
        }
        break;
      case 'import-merge': doImport('merge'); break;
      case 'import-replace': doImport('replace'); break;
      case 'import-cancel': pendingImport = null; var p = $('importPrev'); if(p){ p.classList.remove('show'); p.innerHTML=''; } break;
    }
  });

  document.addEventListener('change', function(e){
    var cb = e.target;
    if(!cb || !cb.getAttribute || cb.getAttribute('data-act') !== 'toggle') return;
    var id = cb.getAttribute('data-arg');
    if(cb.checked) S.tasks[id] = {done:true, doneAt: today()};
    else delete S.tasks[id];
    save();
    var row = cb.closest('.taskrow'); if(row) row.classList.toggle('done', cb.checked);
    // 重新渲染以更新进度条与统计
    var y = window.scrollY;
    render(); window.scrollTo(0, y);
  });

  document.addEventListener('submit', function(e){
    var f = e.target;
    var kind = f.getAttribute('data-form');
    if(!kind) return;
    e.preventDefault();
    var d = new FormData(f);
    if(kind === 'log') addLog(d);
    if(kind === 'word') addWord(d);
    if(kind === 'writing') addWriting(d);
    if(kind === 'speaking') addSpeaking(d);
    if(kind === 'profile') saveProfile(d);
  });

  /* ============ 动作 ============ */
  function num(v){ var n = parseFloat(v); return isNaN(n) ? null : n; }
  function addLog(d){
    var date = d.get('date') || today();
    var skill = d.get('skill');
    var material = (d.get('material') || '').trim();
    var wrong = (d.get('wrong') || '').trim();
    var rec = {id:uid(), date:date, skill:skill, material:material, note:wrong, kind: skill === 'ALL' ? 'mock' : 'practice'};
    if(skill === 'ALL'){
      var bands = {}; var any = false;
      ['L','R','W','S'].forEach(function(k){ var v = num(d.get('band'+k)); if(v != null){ bands[k] = v; any = true; } });
      if(!any){ toast('全套模考至少填一项小分'); return; }
      rec.bands = bands; rec.score = overallOf(bands);
      rec.wrong = wrong;
    } else {
      var sc = num(d.get('score'));
      if(sc == null){ toast('先填分数'); return; }
      rec.score = sc;
      var specific = (d.get('wrong') || '').trim();
      rec.wrong = specific;
    }
    S.logs.push(rec); save(); render(); toast('已记录 ' + (rec.score != null ? rec.score.toFixed(1) : ''));
  }
  function delLog(id){ S.logs = S.logs.filter(function(l){ return l.id !== id; }); save(); render(); toast('已删除'); }
  function addWord(d){
    var term = (d.get('term') || '').trim(), mean = (d.get('meaning') || '').trim();
    if(!term || !mean){ toast('词和释义都要填'); return; }
    S.words.unshift({id:uid(), term:term, meaning:mean, ex:(d.get('ex')||'').trim(), lv:0, addedAt: today(), dueAt: today()});
    save(); render(); toast('已入库');
  }
  function wordReview(id, ok){
    var w = S.words.filter(function(x){ return x.id === id; })[0]; if(!w) return;
    if(ok){
      w.lv = Math.min(4, (w.lv || 0) + 1);
      var gap = [0, 2, 5, 9, 21][w.lv] || 21;
      w.dueAt = addDays(today(), gap);
      save(); render();
      toast('熟了 · ' + gap + ' 天后复习');
    } else {
      w.lv = 0;
      w.dueAt = addDays(today(), 1);
      save(); render();
      toast('退回新词，明天再来');
    }
  }
  function addWriting(d){
    var date = d.get('date') || today();
    S.writing.push({id:uid(), date:date, type:d.get('type')||'T2', prompt:(d.get('prompt')||'').trim(),
      minutes:num(d.get('minutes')), words:num(d.get('words')), band:num(d.get('band')), notes:(d.get('notes')||'').trim()});
    save(); render(); toast('已存档');
  }
  function delWriting(id){ S.writing = S.writing.filter(function(l){ return l.id !== id; }); save(); render(); toast('已删除'); }
  function addSpeaking(d){
    var date = d.get('date') || today();
    S.speaking.push({id:uid(), date:date, part:d.get('part')||'1', prompt:(d.get('prompt')||'').trim(),
      minutes:num(d.get('minutes')), notes:(d.get('notes')||'').trim()});
    save(); render(); toast('已记录');
  }
  function delSpeaking(id){ S.speaking = S.speaking.filter(function(l){ return l.id !== id; }); save(); render(); toast('已删除'); }
  function saveProfile(d){
    var p = S.profile;
    p.name = (d.get('name')||'').trim();
    p.examDate = d.get('examDate') || p.examDate;
    p.weeklyHours = num(d.get('weeklyHours')) || p.weeklyHours;
    var ov = num(d.get('overall')); if(ov != null) p.target.overall = ov;
    ['L','R','W','S'].forEach(function(k){ var v = num(d.get(k)); if(v != null) p.target[k] = v; });
    save(); render(); toast('设置已保存');
  }

  /* ============ 导入导出 ============ */
  function payload(){
    return {
      app:'ielts-bench', version:3, exportedAt: new Date().toISOString(),
      profile:S.profile, tasks:S.tasks, logs:S.logs, words:S.words,
      writing:S.writing, speaking:S.speaking, sessions:S.sessions, meta:S.meta
    };
  }
  function download(name, text){
    var blob = new Blob([text], {type:'application/json;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 400);
  }
  function doExport(){
    var t = today().replace(/-/g,'');
    var name = '雅思工作台-进度-' + t + '.json';
    download(name, JSON.stringify(payload(), null, 2));
    S.meta.lastExport = new Date().toISOString(); save(); render();
    toast('已导出 ' + name);
  }
  function doCopy(){
    var text = JSON.stringify(payload(), null, 2);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast('JSON 已复制到剪贴板'); })
        .catch(function(){ download('雅思工作台-进度-' + today().replace(/-/g,'') + '.json', text); toast('复制受限，已改为下载'); });
    } else {
      download('雅思工作台-进度-' + today().replace(/-/g,'') + '.json', text);
      toast('复制受限，已改为下载');
    }
    S.meta.lastExport = new Date().toISOString(); save();
  }
  var pendingImport = null;
  function handleFile(file){
    if(!file) return;
    var r = new FileReader();
    r.onload = function(){
      var text = String(r.result || '');
      var obj = null;
      try{ obj = JSON.parse(text); }catch(err){ toast('文件不是有效的 JSON'); return; }
      if(!obj || typeof obj !== 'object' || !(obj.app === 'ielts-bench' || (obj.profile && obj.tasks && obj.logs))){
        toast('这不是本工作台的进度文件'); return;
      }
      pendingImport = normalize(obj);
      var imp = pendingImport;
      var done = Object.keys(imp.tasks || {}).filter(function(k){ return imp.tasks[k] && imp.tasks[k].done; }).length;
      var rows = [
        ['导出时间', (imp.meta.lastExport || imp.exportedAt) ? String(imp.meta.lastExport || imp.exportedAt).slice(0,16).replace('T',' ') : '未记录'],
        ['计划完成', done + ' 项'],
        ['成绩记录', imp.logs.length + ' 条'],
        ['词汇', imp.words.length + ' 个'],
        ['写作 / 口语', imp.writing.length + ' 篇 / ' + imp.speaking.length + ' 次'],
        ['专注记录', imp.sessions.length + ' 段'],
        ['考试日期', imp.profile.examDate]
      ].map(function(r){ return '<div class="row"><span>' + r[0] + '</span><b>' + esc(r[1]) + '</b></div>'; }).join('');
      var box = $('importPrev');
      box.innerHTML = rows
        + '<div class="btnrow"><button class="btn solid" data-act="import-replace">覆盖当前进度</button>'
        + '<button class="btn" data-act="import-merge">合并（保留现有，补齐缺失）</button>'
        + '<button class="btn ghost" data-act="import-cancel">取消</button></div>'
        + '<p class="hint">覆盖会丢弃这台设备上的现有记录；合并会按记录 id 去重，勾选取并集。</p>';
      box.classList.add('show');
    };
    r.readAsText(file);
  }
  function doImport(mode){
    if(!pendingImport) return;
    var imp = pendingImport;
    if(mode === 'replace'){
      var keepCreated = S.createdAt;
      S = imp; S.createdAt = keepCreated;
      S.meta = Object.assign({}, S.meta, {lastImport:new Date().toISOString()});
    } else {
      S.tasks = Object.assign({}, S.tasks);
      Object.keys(imp.tasks || {}).forEach(function(k){
        if(imp.tasks[k] && imp.tasks[k].done){ S.tasks[k] = Object.assign({}, S.tasks[k], imp.tasks[k]); }
      });
      S.logs = union(S.logs, imp.logs);
      S.writing = union(S.writing, imp.writing);
      S.speaking = union(S.speaking, imp.speaking);
      S.sessions = union(S.sessions, imp.sessions);
      var byId = {}; S.words.forEach(function(w){ byId[w.id] = w; });
      imp.words.forEach(function(w){
        if(!byId[w.id]) S.words.push(w);
        else if((w.lv || 0) > (byId[w.id].lv || 0)){ byId[w.id].lv = w.lv; byId[w.id].dueAt = w.dueAt; }
      });
      S.meta.lastImport = new Date().toISOString();
    }
    pendingImport = null;
    save(); render();
    toast(mode === 'replace' ? '已覆盖导入' : '已合并导入');
    var p = $('importPrev'); if(p){ p.classList.remove('show'); p.innerHTML = ''; }
  }
  function union(a, b){
    var ids = {}; a.forEach(function(x){ ids[x.id] = 1; });
    b.forEach(function(x){ if(!ids[x.id]){ a.push(x); ids[x.id] = 1; } });
    return a;
  }

  /* ============ 启动 ============ */
  function routeFromHash(){
    var h = (location.hash || '').replace(/^#\/?/, '').split('?')[0];
    return NAV.some(function(n){ return n.r === h; }) ? h : 'overview';
  }
  window.addEventListener('hashchange', function(){
    ui.route = routeFromHash();
    window.scrollTo(0,0);
    render();
  });
  ui.route = routeFromHash();
  save();
  render();
  if(!storageOK){
    setTimeout(function(){ toast('浏览器禁止本地存储，请到「数据」页导出备份'); }, 1200);
  }
})();</script>
